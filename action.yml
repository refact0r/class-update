name: Discord Class Updater
description: automatically update class names in your discord themes
branding:
  icon: file-plus
  color: blue

inputs:
  folder:
    description: folder that has your theme files
    default: themes
  ext:
    description: file extension to target
    default: css
  diff:
    description: >-
      one or more (newline or comma separated) urls/relative paths to a changes file
      (old&new class names on alternating lines) or a class map (json object of old->new).
      sources are applied in order, and a source that cant be read is skipped
    default: |
      https://raw.githubusercontent.com/fedeericodl/discord-update-classnames/data/classNamesMap.json
      https://codeberg.org/SyndiShanX/Update-Classes/raw/branch/pages/Changes.txt

outputs:
  changed:
    description: if any files have changed
  totalChanges:
    description: the total number of classes that were replaced

runs:
  using: node24
  main: dist/index.js
